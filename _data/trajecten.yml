# Alle trajecten op één plek.
# Worden gebruikt op:
#   - de homepage (de korte 'kaart'-versie)
#   - de trajecten-overzichtspagina (samenvatting + 'Lees meer'-knop)
#   - de losse traject-pagina's (volledige beschrijving)
# Pas je hier iets aan, dan verandert het overal mee.
#
# Velden per traject:
#   id        : intern kenmerk
#   pagina    : bestandsnaam van de losse traject-pagina
#   icoon     : Font Awesome-icoon (bv. fa-paw)
#   titel     : kop op de losse traject-pagina
#   meta      : labeltekst met duur/prijs
#   intro     : inleidende alinea
#   herken    : lijst met herkenbare uitspraken (optioneel)
#   punten_titel / punten : opsomming van wat het traject biedt
#   knoppen   : knoppen onder het traject (tekst + link)
#   kaart     : korte versie (kop + tekst) voor homepage en overzicht

- id: puppy
  pagina: puppytraject.html
  icoon: fa-paw
  titel: Puppytraject
  meta: Startpakket 5 lessen · uitbreidbaar
  foto: images/puppy.jpg
  foto_alt: Zwarte pup zit rustig te wachten tijdens een uitje
  intro: >-
    Een fijne start is goud waard. In het puppytraject werken we aan een stevige
    basis: opvoeding, prikkelbeheersing, rust én leren begrijpen wat jouw pup je
    vertelt. Het traject start met een startpakket van 5 lessen, uitbreidbaar naar
    10 of meer lessen als dat past bij wat jullie nodig hebben.
  herken:
    - Mijn puppy is buiten met van alles bezig, behalve met mij.
    - Sinds we de pup hebben is het chaos in huis. De pup is druk, wij krijgen er stress van.
    - Mijn puppy doet het prima op de hondenschool, maar zodra we ons rondje door de wijk lopen, heeft hij bananen in zijn oren.
    - Ik zie dat mijn pup me wel hoort, maar ik lijk niet tot hem door te dringen.
  punten_titel: "In dit traject werken we aan:"
  punten:
    - "De belangrijkste basiscommando's in diverse situaties: thuis, in de wijk, in het bos, op drukke plekken"
    - Leren lezen en begrijpen van jouw hond en hondentaal — zodat je je pup beter begeleidt in nieuwe of moeilijke situaties
    - Prikkelbeheersing en het inbouwen van rustmomenten, thuis én buiten
    - "Maatwerk op basis van wat jouw pup nodig heeft: extra oefenen op commando's, stressreductie, natuurlijke drijfveren leren begrijpen of starten met een passende hondensport"
    - Video-analyse als vast onderdeel — ik film hoe jij met je pup traint en geef gerichte feedback, ook op situaties waar ik niet bij ben
  knoppen:
    - tekst: Vraag naar de mogelijkheden
      link: contact.html
  kaart:
    titel: Puppytraject
    tekst: >-
      Een fijne start met basiscommando's, rust, prikkelbeheersing en hondentaal
      leren lezen. Startpakket van 5 lessen, uitbreidbaar.

- id: maatwerk
  pagina: maatwerk.html
  icoon: fa-dog
  titel: Maatwerk voor volwassen honden
  meta: Maatwerk · losse lessen of pakket
  foto: images/hond-tramhalte.jpg
  foto_alt: Hond traint ontspannen bij een tramhalte in de stad
  intro: >-
    Voor honden én eigenaren die ergens tegenaan lopen in het dagelijks leven. Of het
    nu gaat om meer rust thuis, omgaan met stress op de wandeling, een hondensport
    ontdekken of werken aan probleemgedrag — we kijken samen wat jij en jouw hond nodig
    hebben. Het traject is volledig maatwerk: losse lessen of pakketten van 5 of 10
    lessen, afhankelijk van de casus.
  herken:
    - Mijn hond is thuis super relaxed, maar zodra we gaan wandelen wordt hij hyper.
    - Ik kan niet (meer) ontspannen wandelen met de hond, want hij trekt altijd maar aan de lijn.
    - Op de hondenschool doet hij het perfect, maar zodra we gaan wandelen heeft hij bananen in zijn oren.
    - Ik zou mijn hond zo graag overal mee naartoe nemen, maar durf dat nu niet.
  punten_titel: "Afhankelijk van je vraag werken we aan:"
  punten:
    - "Het trainen of perfectioneren van diverse (basis)commando's in allerlei situaties"
    - Meer rust brengen, thuis of onderweg
    - Ontdekken welke hondensport bij jullie past
    - Omgaan met stress tijdens het wandelen of bij specifieke triggers
    - Begeleiding bij probleemgedrag
    - Video-analyse als vast onderdeel — zodat jij tijdens de training echt aandacht hebt voor je hond, en ik voor jou
  knoppen:
    - tekst: Vraag naar de mogelijkheden
      link: contact.html
  kaart:
    titel: Maatwerk volwassen hond
    tekst: >-
      Loop je ergens tegenaan — van lijntrekken tot uitvalgedrag? Samen kijken we
      wat jij en je hond nodig hebben.

- id: muilkorf
  pagina: muilkorf.html
  icoon: fa-shield-alt
  titel: Muilkorftraining
  meta: Passessie 30 min · €20 · training op lestarief
  foto: images/muilkorf-bos.jpg
  foto_alt: Hond rent vrij en blij door het bos met een goed passende muilkorf
  intro: >-
    Een muilkorf is een hulpmiddel — geen drama. We leren je hond op een positieve,
    rustige manier dat de muilkorf veilig en oké is. Stap voor stap, op het tempo van je hond.
  herken:
    - Op vakantie moet hij in de gondel een muilkorf op, en dat vinden we niks.
    - Dierenartsbezoeken vermijden we, want mijn hond krijgt er stress van.
  punten_titel: "Wat dit traject biedt:"
  punten:
    - Positieve, stapsgewijze gewenning aan de muilkorf
    - Geschikt voor puppy's én volwassen honden
    - Handig voor dierenarts, openbaar vervoer, vakantie of als je hond graag dingen van straat eet
    - De muilkorfpassessie met The Muzzle Movement kost €20 (30 min)
    - Wil je daarna een of meer trainingen om de muilkorf rustig aan te leren? Die gaan op het gewone lestarief
  knoppen:
    - tekst: Vraag naar de mogelijkheden
      link: contact.html
  kaart:
    titel: Muilkorftraining
    tekst: >-
      Positief en rustig leren dat de muilkorf oké is — handig voor dierenarts,
      vervoer of vakantie. Inclusief passessie.

- id: videobel
  pagina: videobelsessie.html
  icoon: fa-video
  titel: Goed voorbereid een hond in huis halen
  meta: Videobelsessie 30-45 min · €50
  foto: images/hond-water.jpg
  foto_alt: Hond kijkt uit over het water aan de rand van de stad
  intro: >-
    Ben jij op zoek naar een hond en vraag je je af hoe je je goed voorbereidt?
    In een videobelsessie denk ik met je mee — vóórdat de hond er is.
  punten_titel: "Wat we bespreken:"
  punten:
    - Waarom wil jij een hond, en wat past bij jouw leven?
    - Pup of volwassen hond, rashond of rescue — of ben je nog zoekende?
    - Handvatten voor het aanschafproces
    - Samen op zoek naar de hond die bij jou en je situatie past
    - Inclusief een vragenlijst vooraf, zodat we efficiënt werken
  knoppen:
    - tekst: Plan een videobelsessie
      link: contact.html
  kaart:
    titel: Videobelsessie
    tekst: >-
      Op zoek naar een hond? In 30-45 minuten bespreken we welke hond past bij jou
      en je situatie. Inclusief voorbereiding.
