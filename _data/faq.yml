# Veelgestelde vragen op de trajecten-pagina, gegroepeerd per thema.
# Voeg een vraag toe door een nieuw 'vraag/antwoord'-paar onder een groep te zetten.

- groep: Over de werkwijze
  vragen:
    - vraag: Waar vinden de lessen plaats?
      antwoord: >-
        De lessen vinden plaats in jullie eigen omgeving: in jullie woonwijk, op een
        plek waar jullie graag wandelen, of op een locatie die past bij het doel van
        de les. Zo train je gedrag dat je in het dagelijks leven nodig hebt, daar waar
        het ook echt nodig is.
    - vraag: Hoe lang duurt een les?
      antwoord: >-
        Een les duurt 60 minuten. Daarin werken we aan de praktijk én nemen we tijd
        voor uitleg. Een muilkorfpassessie duurt 30 minuten, een videobelsessie 30 tot
        45 minuten.
    - vraag: Hoe werkt het met de video's?
      antwoord: >-
        Tijdens de les film ik met een GoPro, zodat jij volledig aandacht kunt hebben
        voor je hond. Achteraf bekijken we samen de beelden: wat zie je gebeuren, wat
        werkte goed? Je kunt ook zelf filmen tussen lessen door, voor feedback op
        situaties waar ik niet bij ben.
    - vraag: Wat gebeurt er met de beelden?
      antwoord: >-
        De beelden zijn er voor jou en mij om van te leren. Ze worden niet zonder jouw
        toestemming gedeeld of gebruikt. Wil je dat een fragment verwijderd wordt? Dan
        doe ik dat direct.
    - vraag: Welke trainingsmethode gebruik je?
      antwoord: >-
        Ik werk welzijnsgericht en positief. We kijken naar wat jouw hond nodig heeft,
        werken op zijn tempo, en bouwen op succeservaringen in plaats van op straf of dwang.

- groep: Voor wie en wanneer
  vragen:
    - vraag: Vanaf welke leeftijd kan ik starten met mijn pup?
      antwoord: >-
        Je kunt starten zodra de puppy bij jullie is. Hoe eerder we beginnen met een
        goede basis, hoe meer profijt je daar later van hebt.
    - vraag: Is mijn hond niet te oud om nog te leren?
      antwoord: >-
        Honden kunnen op elke leeftijd nog nieuwe dingen leren. Soms gaat het bij een
        oudere hond zelfs sneller, omdat hij meer rust en concentratie heeft dan een
        puppy. Het is nooit te laat.
    - vraag: Mijn hond valt soms uit. Kan ik dan ook komen?
      antwoord: >-
        Ja, juist dan. Omdat we 1-op-1 werken en op locatie trainen, kunnen we het
        tempo en de prikkels precies afstemmen op wat jouw hond aankan. We zoeken samen
        naar wat erachter zit en wat helpt.
    - vraag: Ik heb al een hondenschool gedaan. Voegt dit iets toe?
      antwoord: >-
        Heel vaak wel. Op een hondenschool oefen je in een vaste omgeving. Gedrag landt
        pas echt als je het oefent in de situaties waar je het nodig hebt: jullie eigen
        wijk, een drukke straat, het terras. Dat is precies waar Hondbaar zich op richt.

- groep: Praktisch & boekingen
  vragen:
    - vraag: Wat is het werkgebied?
      antwoord: >-
        Het werkgebied is Ede en omliggende plaatsen. Voor lessen op locatie reken ik
        €0,35 per kilometer, gerekend vanaf postcode 6717XN.
    - vraag: Losse lessen of een pakket?
      antwoord: >-
        Voor een puppy of een grotere veranderingsvraag werkt een pakket meestal beter —
        gedrag heeft tijd nodig om in te slijten. Twijfel je? Neem contact op en we
        bespreken wat voor jullie het meest logisch is.
    - vraag: Wat als ik een les niet kan?
      antwoord: >-
        Geen probleem — laat het zo snel mogelijk weten, dan plannen we de les opnieuw.
        Bij afzeggen binnen 24 uur breng ik de les in rekening, behalve bij overmacht.
    - vraag: Wat als het slecht weer is?
      antwoord: >-
        Wij gaan gewoon door — je hond moet ook in de regen kunnen wandelen. Bij echt
        extreem weer kijken we samen of het verstandig is om te verplaatsen.
    - vraag: Moet ik zelf spullen meenemen?
      antwoord: >-
        Neem in elk geval mee: lekkere beloningen waar je hond echt enthousiast van wordt,
        een goed zittend tuig of halsband, en een normale lijn. De rest bespreken we per les.
