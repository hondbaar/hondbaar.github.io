# Veelgestelde vragen op de trajecten-pagina, gegroepeerd per thema.
# Voeg een vraag toe door een nieuw 'vraag/antwoord'-paar onder een groep te zetten.

- groep: Over de werkwijze
  vragen:
    - vraag: Waar vinden de lessen plaats?
      antwoord: >-
        De lessen vinden plaats in jullie eigen omgeving: in jullie woonwijk, op een
        plek waar jullie graag wandelen, of op een locatie die past bij het doel van
        de les (zoals een terras, het bos of een drukke straat). Zo train je gedrag
        dat je in het dagelijks leven nodig hebt, daar waar het ook echt nodig is.
    - vraag: Hoe lang duurt een les?
      antwoord: >-
        Een les duurt 60 minuten. Daarin werken we aan de praktijk én nemen we tijd
        voor uitleg en theorie. Een muilkorfpassessie duurt 30 minuten. Een
        videobelsessie voor toekomstige hondeneigenaren duurt 30 tot 45 minuten.
    - vraag: Hoe werkt het met de GoPro-video's?
      antwoord: >-
        Tijdens de les film ik met de GoPro, zodat jij volledig aandacht kunt hebben
        voor je hond. Achteraf bekijken we samen de beelden — wat zie je gebeuren, wat
        doet je hond, wat werkte goed? Zo leer je het gedrag van je hond én je eigen
        reacties écht zien. Je kunt ook zelf filmen tussen lessen door, zodat je
        feedback krijgt op situaties waar ik niet bij ben.
    - vraag: Wat gebeurt er met de beelden?
      antwoord: >-
        De beelden zijn er voor jou en mij om van te leren. Ze worden niet zonder jouw
        toestemming gedeeld of gebruikt. Wil je dat een beeld(fragment) verwijderd
        wordt? Dan doe ik dat direct. Als ik beelden wil gebruiken voor bijvoorbeeld
        een social-mediapost, vraag ik daar altijd vooraf expliciet toestemming voor.
    - vraag: Welke trainingsmethode gebruik je?
      antwoord: >-
        Ik werk welzijnsgericht en positief. Dat betekent dat we kijken naar wat jouw
        hond nodig heeft, op zijn tempo werken, en bouwen op succeservaringen in plaats
        van op straf of dwang. Geen pijn, geen schrik, geen frustratie als trainingsmiddel.

- groep: Voor wie en wanneer
  vragen:
    - vraag: Vanaf welke leeftijd kan ik starten met mijn pup?
      antwoord: >-
        Je kunt starten zodra de puppy bij jullie is. Hoe eerder we beginnen met een
        goede basis — structuur, rust, leren begrijpen wat je puppy je vertelt — hoe
        meer profijt je daar later van hebt.
    - vraag: Is mijn hond niet te oud om nog te leren?
      antwoord: >-
        Honden kunnen op elke leeftijd nog nieuwe dingen leren. Soms gaat het bij een
        oudere hond zelfs sneller, omdat hij meer rust en concentratie heeft dan een
        puppy. Het is nooit te laat.
    - vraag: Mijn hond valt soms uit naar andere honden of mensen. Kan ik dan ook komen?
      antwoord: >-
        Ja, juist dan. Omdat we 1-op-1 werken en op locatie trainen, kunnen we het
        tempo en de prikkels precies afstemmen op wat jouw hond aankan. Dat is een
        groot voordeel ten opzichte van een groepsles. We zoeken samen naar wat
        erachter zit en wat helpt om jullie meer rust en veiligheid te geven.
    - vraag: Ik heb al een hondenschool gedaan, maar het gaat thuis nog niet goed. Voegt dit dan iets toe?
      antwoord: >-
        Heel vaak wel. Op een hondenschool oefen je in een vaste omgeving met dezelfde
        prikkels. Dat is een prima start, maar gedrag landt pas echt als je het oefent
        in de situaties waar je het nódig hebt: jullie eigen wijk, een drukke straat,
        het terras waar je graag zit. Dat is precies waar Hondbaar zich op richt.

- groep: Praktisch & boekingen
  vragen:
    - vraag: Wat is het werkgebied?
      antwoord: >-
        Het werkgebied is Ede en de omliggende plaatsen. Voor lessen op locatie reken
        ik €0,35 per kilometer, gerekend vanaf postcode 6717XN.
    - vraag: Moet ik losse lessen of een pakket kiezen?
      antwoord: >-
        Voor een puppy of een grotere veranderingsvraag werkt een pakket meestal beter
        — gedrag heeft tijd nodig om in te slijten en doorzettende structuur helpt
        daarbij. Twijfel je? Neem contact op en we bespreken samen wat voor jullie het
        meest logisch is.
    - vraag: Hoe lang duurt een traject?
      antwoord: >-
        Dat is afhankelijk van de vraag en het tempo dat past bij jullie. Een
        5-lessenpakket plannen we vaak in over een paar weken tot een paar maanden. Een
        puppytraject loopt regelmatig wat langer door, omdat de pup zelf ook moet
        groeien. We bespreken het ritme dat realistisch is voor jullie agenda én voor de hond.
    - vraag: Wat als ik een les niet kan?
      antwoord: >-
        Geen probleem — laat het zo snel mogelijk weten, dan plannen we de les opnieuw.
        Bij afzeggen op korte termijn (binnen 24 uur) breng ik de les in rekening,
        behalve bij overmacht.
    - vraag: Wat als het regent of slecht weer is?
      antwoord: >-
        Wij gaan gewoon door — je hond moet ook in de regen kunnen wandelen, dus daar
        oefenen we ook in. Bij echt extreem weer (storm, onweer, ijzel) kijken we samen
        of het verstandig is om te verplaatsen.
    - vraag: Hoe en wanneer betaal ik?
      antwoord: >-
        Pakketten worden vooraf gefactureerd. Losse lessen betaal je per les. Betaling
        gaat via een factuur die je per mail krijgt.
    - vraag: Moet er iemand anders mee bij de les?
      antwoord: >-
        Iedereen die regelmatig met de hond te maken heeft, is welkom. Sterker nog: als
        alle gezinsleden op dezelfde manier met de hond omgaan, leert hij sneller en
        duidelijker wat er van hem verwacht wordt.
    - vraag: Moet ik zelf spullen meenemen?
      antwoord: >-
        Neem in elk geval mee: lekkere beloningen waar je hond echt enthousiast van
        wordt, een goed zittend tuig of halsband, en een normale lijn. Voor de rest
        bespreken we per les wat handig is.
