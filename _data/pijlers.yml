# Herbruikbare 'pijler'-blokjes (icoon + kop + tekst).

# De aanpak — homepage
aanpak:
  - icoon: fa-route
    titel: In echte situaties
    tekst: >-
      We trainen daar waar het misgaat én waar het moet landen: in de wijk, op het
      terras, bij het station. Gedrag dat blijft hangen.
  - icoon: fa-video
    titel: Met video-analyse
    tekst: >-
      Tijdens de les film ik mee, zodat jij alle aandacht voor je hond hebt. Achteraf
      bekijken we samen wat er gebeurt — en zie je het echt.
  - icoon: fa-hand-holding-heart
    titel: Coaching voor jou
    tekst: >-
      Een hond verandert als zijn mens verandert. Daarom leer jij je hond aanvoelen,
      lezen en begeleiden — dat is waar duurzame verandering begint.

# Waar Hondbaar voor staat — over-pagina
waarden:
  - icoon: fa-heart
    titel: Dierbaar
    tekst: >-
      Jouw hond is geen project, maar een gezinslid. Welzijn en de band tussen jullie
      staan altijd voorop.
  - icoon: fa-eye
    titel: Zichtbaar
    tekst: >-
      Met video-analyse maken we zichtbaar wat anders ongezien blijft — in het gedrag
      van je hond én in jouw begeleiding.
  - icoon: fa-hand-holding-heart
    titel: Voelbaar
    tekst: >-
      Het resultaat voel je in het dagelijks leven: meer rust, meer vertrouwen, en
      meer plezier samen op pad.

# Drie pijlers muilkorf — muilkorf-pagina
muilkorf:
  - icoon: fa-seedling
    titel: Positief & stapsgewijs
    tekst: >-
      We bouwen de gewenning rustig op, zodat je hond zelf een fijne associatie krijgt
      met de muilkorf. Geen dwang, geen schrik.
  - icoon: fa-paw
    titel: Voor puppy én volwassen hond
    tekst: >-
      Jong geleerd is mooi meegenomen, maar ook een volwassen hond leert vaak sneller
      dan je denkt dat de muilkorf oké is.
  - icoon: fa-ruler-combined
    titel: De juiste pasvorm
    tekst: >-
      Een muilkorf werkt alleen als hij goed past én je hond ermee kan hijgen en
      drinken. Daarom hoort een passessie erbij.
