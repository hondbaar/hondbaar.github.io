<head>
		<title>{{ page.title }}</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="{{ page.description | default: site.description }}" />

		<!-- Open Graph / social media (deelvoorbeeld) -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Hondbaar" />
		<meta property="og:title" content="{{ page.title | default: site.title }}" />
		<meta property="og:description" content="{{ page.description | default: site.description }}" />
		<meta property="og:image" content="{{ '/images/og-hondbaar.jpg' | absolute_url }}" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Logo Hondbaar — coaching voor baas en hond. Dierbaar · Voelbaar · Zichtbaar" />
		<meta property="og:url" content="{{ page.url | absolute_url }}" />
		<meta property="og:locale" content="nl_NL" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="{{ page.title | default: site.title }}" />
		<meta name="twitter:description" content="{{ page.description | default: site.description }}" />
		<meta name="twitter:image" content="{{ '/images/og-hondbaar.jpg' | absolute_url }}" />

		<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}" />
		<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
		<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}" />
		<noscript><link rel="stylesheet" href="{{ '/assets/css/noscript.css' | relative_url }}" /></noscript>
{% if site.data.site.google_tag_id and site.data.site.google_tag_id != "" %}
		<!-- Google tag (gtag.js) met Consent Mode v2 -->
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			// Standaard: alle opslag geweigerd tot de bezoeker toestemming geeft.
			gtag('consent', 'default', {
				'ad_storage': 'denied',
				'ad_user_data': 'denied',
				'ad_personalization': 'denied',
				'analytics_storage': 'denied',
				'wait_for_update': 500
			});
			// Eerder gegeven toestemming direct herstellen (vóór de tag laadt).
			try {
				if (localStorage.getItem('hb-consent') === 'granted') {
					gtag('consent', 'update', {
						'ad_storage': 'granted',
						'ad_user_data': 'granted',
						'ad_personalization': 'granted',
						'analytics_storage': 'granted'
					});
				}
			} catch (e) {}
			gtag('js', new Date());
			gtag('config', '{{ site.data.site.google_tag_id }}');
{% if site.data.site.ga4_id and site.data.site.ga4_id != "" %}
			gtag('config', '{{ site.data.site.ga4_id }}');   // Google Analytics 4
{% endif %}
		</script>
		<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.data.site.google_tag_id }}"></script>
{% endif %}
	</head>
