<head>
		<title>{{ page.title }}</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="{{ page.description | default: site.description }}" />

		<!-- Open Graph / social media (deelvoorbeeld) -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Hondbaar" />
		<meta property="og:title" content="{{ page.title | default: site.title }}" />
		<meta property="og:description" content="{{ page.description | default: site.description }}" />
		<meta property="og:image" content="{{ '/images/og-hondbaar.jpg' | absolute_url }}" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Logo Hondbaar — coaching voor baas en hond. Dierbaar · Voelbaar · Zichtbaar" />
		<meta property="og:url" content="{{ page.url | absolute_url }}" />
		<meta property="og:locale" content="nl_NL" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="{{ page.title | default: site.title }}" />
		<meta name="twitter:description" content="{{ page.description | default: site.description }}" />
		<meta name="twitter:image" content="{{ '/images/og-hondbaar.jpg' | absolute_url }}" />

		<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}" />
		<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
		<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}" />
		<noscript><link rel="stylesheet" href="{{ '/assets/css/noscript.css' | relative_url }}" /></noscript>
	</head>
