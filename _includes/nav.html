<!-- Header -->
					<header id="header">
						<a href="{{ '/' | relative_url }}" class="logo">hondbaar</a>
					</header>

				<!-- Nav -->
					<nav id="nav">
						<ul class="links">
							<li class="nav-logo"><a href="{{ '/' | relative_url }}" aria-label="Hondbaar home"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><g fill="currentColor"><circle cx="20" cy="16" r="6"/><path d="M20,23 C24,23 26,27 26,32 L27,50 L21,50 L18,37 L17,37 L14,50 L8,50 L11,32 C11,27 13,23 17,23 Z"/><ellipse cx="42" cy="40" rx="12" ry="7"/><circle cx="51" cy="31" r="6"/><path d="M55,31 L62,30 L60,37 L55,36 Z"/><path d="M48,25 L51,18 L55,26 Z"/><rect x="34" y="45" width="3" height="11" rx="1.5"/><rect x="49" y="45" width="3" height="11" rx="1.5"/><path d="M31,37 C25,35 24,28 29,25 C25,31 31,38 37,37 Z"/></g></svg></a></li>
							<li{% if page.nav == "home" %} class="active"{% endif %}><a href="{{ '/' | relative_url }}">Home</a></li>
							<li class="has-submenu{% if page.nav == "trajecten" %} active{% endif %}"><a href="{{ '/trajecten.html' | relative_url }}">Trajecten</a>
								<ul class="submenu">
									{% for traject in site.data.trajecten %}
									<li><a href="{{ traject.pagina | relative_url }}">{{ traject.kaart.titel }}</a></li>
									{% endfor %}
								</ul>
							</li>
							<li{% if page.nav == "tarieven" %} class="active"{% endif %}><a href="{{ '/tarieven.html' | relative_url }}">Tarieven</a></li>
							<li{% if page.nav == "over" %} class="active"{% endif %}><a href="{{ '/over.html' | relative_url }}">Over Hondbaar</a></li>
							<li{% if page.nav == "contact" %} class="active"{% endif %}><a href="{{ '/contact.html' | relative_url }}">Contact</a></li>
						</ul>
						<ul class="icons">
							<li><a href="mailto:{{ site.email }}" class="icon solid fa-envelope"><span class="label">E-mail</span></a></li>
						</ul>
					</nav>
