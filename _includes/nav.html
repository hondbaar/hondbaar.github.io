<!-- Header -->
					<header id="header">
						<a href="{{ '/' | relative_url }}" class="logo logo-image" aria-label="Hondbaar home">
							<img src="{{ '/assets/logo-hondbaar-light-trans.svg' | relative_url }}" alt="Logo Hondbaar — coaching voor baas en hond. Dierbaar · Voelbaar · Zichtbaar" />
						</a>
					</header>

				<!-- Nav -->
					<nav id="nav" aria-label="Hoofdmenu">
						<ul class="links">
							<li class="nav-logo"><a href="{{ '/' | relative_url }}" aria-label="Hondbaar home"><img class="mark-light" src="{{ '/assets/logo-mark-light.svg' | relative_url }}" alt="" /><img class="mark-color" src="{{ '/assets/logo-mark.svg' | relative_url }}" alt="" /></a></li>
							<li{% if page.nav == "home" %} class="active"{% endif %}><a href="{{ '/' | relative_url }}">Home</a></li>
							<li class="has-submenu{% if page.nav == "trajecten" %} active{% endif %}"><a href="{{ '/trajecten.html' | relative_url }}">Trajecten</a>
								<ul class="submenu">
									{% for traject in site.data.trajecten %}
									<li><a href="{{ traject.pagina | relative_url }}">{{ traject.kaart.titel }}</a></li>
									{% endfor %}
								</ul>
							</li>
							<li{% if page.nav == "tarieven" %} class="active"{% endif %}><a href="{{ '/tarieven.html' | relative_url }}">Tarieven</a></li>
							<li{% if page.nav == "over" %} class="active"{% endif %}><a href="{{ '/over.html' | relative_url }}">Over Hondbaar</a></li>
							<li{% if page.nav == "verantwoord" %} class="active"{% endif %}><a href="{{ '/verantwoord-eigenaarschap.html' | relative_url }}">Verantwoord eigenaarschap</a></li>
							<li{% if page.nav == "contact" %} class="active"{% endif %}><a href="{{ '/contact.html' | relative_url }}">Contact</a></li>
						</ul>
						<ul class="icons">
							<li><a href="mailto:{{ site.email }}" class="icon solid fa-envelope"><span class="label">E-mail</span></a></li>
						</ul>
					</nav>
